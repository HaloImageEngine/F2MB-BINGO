<section class="howtoplay-page">
  <header class="howtoplay-page__header">
    <a routerLink="/console" class="howtoplay-page__back">&larr; Back to Console</a>
    <h1>How to Play</h1>
    <p>
      Music Bingo replaces numbers with song snippets. Players listen, mark artist names on their cards,
      and win with five in a row.
    </p>
  </header>

  <figure class="howtoplay-page__figure">
    <img
      class="howtoplay-page__image"
      [src]="guideImageSrc"
      [alt]="guideImageAlt"
      width="1920"
      height="1080"
      loading="lazy"
      decoding="async" />
    <figcaption class="howtoplay-page__caption">
      Family Bingo: how to play at holidays, reunions, and family game night.
    </figcaption>
  </figure>
</section>
